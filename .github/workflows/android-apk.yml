name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-apk:
    name: Test & Build Solar Sandbox APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install the exact compile SDK and build tools
        run: sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"

      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Restore optional debug signing identity and prepare .env
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_B64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > debug.keystore
              chmod 600 debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
              chmod 600 debug.keystore
            fi
          fi
          # With no custom key, Gradle automatically generates its standard debug keystore.
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          chmod +x gradlew

      - name: Build Debug APK
        id: debug_build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Run unit and Robolectric tests
        id: tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Run Android lint
        id: lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Render actual GLES shaders and verify globe landmarks
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 ffmpeg
          python3 tests/render_visuals.py
          python3 tests/black_hole_visuals.py

      - name: Upload visual verification previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Sandbox-visual-verification
          path: build/visuals/
          if-no-files-found: ignore

      - name: Verify APK signature, package metadata, and checksum
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$APK.signing.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$APK.badging.txt"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Sandbox-build-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload Debug APK artifact
        id: debug_upload
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Sandbox-debug-apk
          path: app/build/outputs/apk/debug/
          if-no-files-found: error

      - name: Check for Release Signing Secrets
        id: release_check
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Release Keystore & Build Signed Release APK + AAB
        if: steps.release_check.outputs.has_secrets == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          chmod 600 "${{ github.workspace }}/my-upload-key.jks"
          export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload Signed Release APK artifact
        if: steps.release_check.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Sandbox-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Signed Release AAB artifact
        if: steps.release_check.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Sandbox-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Write Build Summary
        if: always()
        run: |
          echo "## Solar Sandbox CI Status" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.debug_upload.outcome }}" = "success" ]; then
            echo "- **Debug APK:** Verified & uploaded as \`Solar-Sandbox-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Unit tests:** ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Android lint:** ${{ steps.lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.release_check.outputs.has_secrets }}" = "true" ]; then
            echo "- **Signed Release APK & AAB:** Enabled via repository secrets" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Signed Release APK:** Skipped (add \`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` in GitHub Repository Secrets to enable signed release builds)" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Publish GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: Solar-Sandbox-debug-apk
          path: artifacts/debug

      - name: Download Release APK (if built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Solar-Sandbox-release-apk
          path: artifacts/release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/debug/*.apk
            artifacts/release/*.apk
