name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build Solar Sandbox APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          SDK_MANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and .env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Sandbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Check for Release Signing Secrets
        id: release_check
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Release Keystore & Build Signed Release APK + AAB
        if: steps.release_check.outputs.has_secrets == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
          export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload Signed Release APK artifact
        if: steps.release_check.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Sandbox-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Signed Release AAB artifact
        if: steps.release_check.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Sandbox-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Write Build Summary
        if: always()
        run: |
          echo "## Solar Sandbox CI Status" >> "$GITHUB_STEP_SUMMARY"
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "- **Debug APK:** Built & uploaded as \`Solar-Sandbox-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.release_check.outputs.has_secrets }}" = "true" ]; then
            echo "- **Signed Release APK & AAB:** Enabled via repository secrets" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Signed Release APK:** Skipped (add \`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` in GitHub Repository Secrets to enable signed release builds)" >> "$GITHUB_STEP_SUMMARY"
          fi
